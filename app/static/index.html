<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Gulam Mustafa">
<title>SearchNexus AI · AI search assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header><h1>SearchNexus AI<small>answers from the live web</small></h1><button class="ghost" id="new">New chat</button></header>
<main><div id="log" aria-live="polite"></div></main>
<footer>
<div id="status" role="status" aria-live="polite"></div>
<form id="f"><textarea id="q" rows="1" maxlength="2000" placeholder="Ask anything, or tap the mic…" aria-label="Your question"></textarea>
<select id="lang" aria-label="Speech language"><option value="en-IN">English (India)</option><option value="hi-IN">हिन्दी</option><option value="en-US">English (US)</option><option value="ur-IN">اردو</option></select>
<button id="mic" class="mic" type="button" aria-label="Speak your question" aria-pressed="false" title="Speak your question"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
<button id="send" type="submit">Ask</button></form>
<p class="credit">Developed by <b>Gulam Mustafa</b></p>
</footer>
<script src="/app.js"></script>
</body>
</html>
